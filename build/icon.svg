<svg width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="256" height="256" rx="50" fill="url(#grad1)"/>
  
  <!-- 屏幕图标 -->
  <rect x="50" y="60" width="156" height="100" rx="8" fill="white" opacity="0.9"/>
  <rect x="60" y="70" width="136" height="80" rx="4" fill="#667eea"/>
  
  <!-- 录制按钮 -->
  <circle cx="128" cy="180" r="20" fill="#f5576c"/>
  <circle cx="128" cy="180" r="12" fill="white"/>
  
  <!-- 装饰线条 -->
  <line x1="80" y1="50" x2="80" y2="40" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="128" y1="50" x2="128" y2="40" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="176" y1="50" x2="176" y2="40" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
</svg>


